<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="openai-portal-game" content="learn-and-leap"><meta name="theme-color" content="#101c2d"><meta name="description" content="Learn & Leap Adventure v15.0: 100 playable educational levels in ten distinct fantasy worlds with world-specific mechanics, three languages and five age groups."><title>Learn & Leap Adventure — 100-Level World Variety Adventure</title><link rel="stylesheet" href="src/style.css"></head><body>
<main class="game-shell">
 <div class="game-frame" id="frame">
  <canvas id="world" width="1280" height="720" tabindex="0" aria-label="Learn and Leap fantasy platform game"></canvas>
  <div class="vignette"></div>
  <header class="hud" id="hud" hidden>
   <div class="hud-left"><div class="avatar">✦</div><div><div class="hearts" id="hearts">♥ ♥ ♥</div><div class="hud-mini" id="hudLevel">WHISPERING WOODS · 01</div></div></div>
   <div class="hud-center"><span class="hud-pill">✧ <b id="coins">0</b></span><span class="hud-pill">✦ <b id="energy">0</b></span><span class="hud-pill keys" id="keys">◇ ◇ ◇ ◇</span></div>
   <div class="hud-right"><button id="pauseBtn" class="hud-btn" aria-label="Pause" title="Pause Game">Ⅱ</button></div>
  </header>
  <div id="missionTag" class="mission-tag" aria-live="polite"></div>
  <div id="hint" class="floating-hint" hidden></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="screen" class="screen" role="region" aria-label="Game menu"><div id="screenBody"></div></div>
  <div id="question" class="question-backdrop" hidden><section class="question-card" role="dialog" aria-modal="true" aria-labelledby="questionTitle"><div class="rune-top">✧ <span id="questionSubject"></span> ✧</div><h2 id="questionTitle"></h2><p class="challenge-instruction" id="challengeInstruction"></p><div id="answers" class="answers"></div><p class="question-feedback" id="feedback" aria-live="polite"></p><div class="question-foot"><button id="hintBtn" class="link-btn"></button><button id="closeQuestion" class="link-btn"></button></div></section></div>
  <div class="touch-controls" id="touchControls" hidden><div class="touch-left"><button data-control="left" aria-label="Move left"><span class="tc-ico">◀</span><small class="tc-lbl">LEFT</small></button><button data-control="right" aria-label="Move right"><span class="tc-ico">▶</span><small class="tc-lbl">RIGHT</small></button></div><div class="touch-right"><button data-control="interact" class="interact" aria-label="Answer Quiz Shrine"><span class="tc-ico">✧</span><small class="tc-lbl">QUIZ</small></button><button data-control="attack" class="attack" aria-label="Cast Magic"><span class="tc-ico">✦</span><small class="tc-lbl">MAGIC</small></button><button data-control="jump" class="jump" aria-label="Jump"><span class="tc-ico">↑</span><small class="tc-lbl">JUMP</small></button></div></div>
 </div>
 <div class="outside-note"><span>✦ LEARN & LEAP <span class="muted">· v15.0 FULL ADVENTURE</span></span><span class="desktop-guide">← → Move · Space Jump · E Quiz · J Magic · Esc Pause</span><span class="mobile-guide">Use the top O.A.I. bar for Main Page, Start Game, Full Screen &amp; Exit</span></div>
</main>
<noscript><div class="fatal">JavaScript is required to play. Open the hosted HTTPS website in Safari or Chrome, not a file preview.</div></noscript>
<div id="runtimeError" class="fatal" hidden role="alert" aria-live="assertive"></div>
<script>
(function(){
 const show=(msg)=>{const box=document.getElementById('runtimeError');if(box){box.hidden=false;box.style.display='grid';box.textContent='Game could not start: '+msg+' — Open the HTTPS website in Safari or Chrome, and check that the src/ files were uploaded.';}};
 window.addEventListener('error',e=>{if(e.message)show(e.message)});window.addEventListener('unhandledrejection',e=>show(e.reason?.message||String(e.reason)));
 window.addEventListener('load',()=>{setTimeout(()=>{if(!window.__LEAP_DEBUG__)show('Game engine did not initialize. Open the hosted website in Safari or Chrome.')},2500)});
})();
</script>
<script src="../shared/portal-sdk.js?v=3.1.0"></script>
<script src="src/diversity_v13.js"></script><script src="src/world1_v14.js"></script><script src="src/worlds_v15.js"></script><script src="src/curriculum.js"></script><script src="src/levels.js"></script>
<script type="module" src="src/main.js"></script>
</body></html>
